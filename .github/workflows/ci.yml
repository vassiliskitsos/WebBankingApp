name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore WebBanking.slnx

      - name: Build
        run: dotnet build WebBanking.slnx --no-restore

      # The Playwright script is copied to the test output by the Microsoft.Playwright package.
      - name: Install Chromium for the end-to-end tests
        run: |
          pwsh WebBanking.Tests/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      # Integration tests start PostgreSQL with Testcontainers, which uses Docker on the runner.
      # End-to-end tests publish the Blazor client and drive it with Playwright.
      - name: Test (unit, integration and end-to-end)
        run: dotnet test WebBanking.slnx --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/test-results.trx"
          if-no-files-found: ignore
